name: SplitEasy
options:
  bundleIdPrefix: com.spliteasy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
targets:
  SplitEasy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SplitEasy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spliteasy.SplitEasy
        SWIFT_VERSION: 5.9
        INFOPLIST_FILE: SplitEasy/Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PlaidLink
        product: LinkKit
  SplitEasyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SplitEasyTests
    dependencies:
      - target: SplitEasy
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  PlaidLink:
    url: https://github.com/plaid/plaid-link-ios
    from: 5.6.0
